<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Checklista otwarcia zmiany – demo</title>
<meta name="description" content="Mobilna checklista otwarcia restauracji z dwoma wariantami dnia. Wersja demonstracyjna z ogólnymi krokami.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF7F2;--card:#FFFFFF;--ink:#1C1714;--ember:#D9401B;--done:#2A7F50;
  --muted:#6F655E;--line:#EBE3D9;--line-strong:#D8CDBF;
  --shadow:0 1px 2px rgba(28,23,20,.05),0 8px 24px rgba(28,23,20,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:110px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
.demo{background:#1C1714;color:#FAF7F2;font-size:12.5px;text-align:center;padding:8px 16px}
.demo a{color:#FFD9C9}
header{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.head{max-width:640px;margin:0 auto;padding:12px 16px 12px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);margin:0}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:24px;line-height:1;text-transform:uppercase;margin:2px 0 0}
.count{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;padding-top:4px}
.count b{color:var(--ember)}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.fill{height:100%;width:0;background:var(--ember);border-radius:99px;transition:width .3s ease}
.fill.full{background:var(--done)}
.controls{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;flex:1;min-width:220px}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;font:600 13px 'Inter',sans-serif;color:var(--muted);padding:9px 6px;border-radius:8px;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(28,23,20,.12)}
.iconbtn{border:1px solid var(--line-strong);background:var(--card);border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.auto{font-size:12px;color:var(--muted);margin-top:6px}
main{padding-top:16px}
.phase{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.phase-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--paper);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font:700 15px 'Barlow Condensed',sans-serif}
.phase.complete .num{background:var(--done);border-color:var(--done);color:#fff}
.ptitle{flex:1;min-width:0}
.ptitle strong{display:block;font:700 18px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.ptitle span{font-size:12.5px;color:var(--muted)}
.chev{transition:transform .2s}
.phase.open .chev{transform:rotate(180deg)}
.items{list-style:none;margin:0;padding:0 8px 8px;display:none}
.phase.open .items{display:block}
.item label{display:flex;gap:12px;align-items:flex-start;padding:11px 8px;border-radius:10px;cursor:pointer;min-height:44px}
.item label:hover{background:var(--paper)}
.item input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--line-strong);border-radius:7px;margin:1px 0 0;display:grid;place-content:center;cursor:pointer;background:#fff}
.item input:checked{background:var(--done);border-color:var(--done)}
.item input:checked::after{content:"";width:12px;height:7px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.item input:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
.lead{font-size:15px;font-weight:500}
.sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.item input:checked + span .lead{color:var(--muted);text-decoration:line-through}
body[data-view="focus"] .phase{display:none}
body[data-view="focus"] .phase.current{display:block}
body[data-view="focus"] .phase.current .items{display:block}
body[data-view="focus"] .phase .chev{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20}
.bottom .wrap{display:flex;gap:10px;padding:0}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);font:700 16px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.btn.primary{background:var(--ember);border-color:var(--ember);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
body[data-view="list"] .focus-only{display:none}
.timer{display:flex;align-items:center;gap:10px;margin:6px 8px 8px;padding:10px 12px;border-radius:12px;background:#FFF1EA;border:1px solid #F4C9B6;font-size:13.5px}
.timer b{font:700 20px 'Barlow Condensed',sans-serif;min-width:52px}
.timer button{margin-left:auto;border:0;background:var(--ember);color:#fff;font:600 13px 'Inter',sans-serif;padding:8px 12px;border-radius:9px;min-height:40px;cursor:pointer}
.menu{position:fixed;inset:0;background:rgba(28,23,20,.4);display:none;z-index:40;align-items:flex-end;justify-content:center}
.menu.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet h2{font:700 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;margin:0 0 8px}
.sheet button.jump{display:flex;width:100%;gap:12px;align-items:center;text-align:left;border:0;background:transparent;padding:12px 6px;border-bottom:1px solid var(--line);font:500 15px 'Inter',sans-serif;cursor:pointer;color:var(--ink);min-height:44px}
.sheet .reset{margin-top:12px;width:100%}
.done-msg{display:none;text-align:center;padding:28px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px}
.done-msg strong{display:block;font:700 26px 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--done)}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:24px 0}
</style>
</head>
<body data-view="focus">
<div class="demo">Wersja demonstracyjna z ogólnymi krokami · <a href="https://github.com/DrawnGirl/Portfolio/blob/main/README_PL.md">Zobacz portfolio</a></div>
<header>
  <div class="head">
    <div class="toprow">
      <div>
        <p class="kicker">Restauracja · demo</p>
        <h1>Zmiana otwierająca</h1>
      </div>
      <div style="display:flex;gap:8px;align-items:flex-start">
        <div class="count" id="count">0/0</div>
        <button class="iconbtn" id="menuBtn" aria-label="Menu faz">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="track" role="progressbar" aria-label="Postęp" aria-valuemin="0" aria-valuemax="100" id="track"><div class="fill" id="fill"></div></div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Typ dnia">
        <button type="button" data-day="delivery">Dostawa · 7:00</button>
        <button type="button" data-day="regular">Zwykły · 8:00</button>
      </div>
      <div class="seg" role="group" aria-label="Widok">
        <button type="button" data-view="focus">Krok po kroku</button>
        <button type="button" data-view="list">Lista</button>
      </div>
    </div>
    <div class="auto" id="autoNote"></div>
  </div>
</header>

<main class="wrap">
  <div id="phases"></div>
  <div class="done-msg" id="doneMsg"><strong>Zmiana otwarta</strong>Wszystkie kroki odhaczone. Dobrej zmiany!</div>
  <p class="foot">Kroki są ogólne i służą tylko do pokazania działania aplikacji. Stan zapisuje się w tej przeglądarce.</p>
</main>

<div class="bottom focus-only">
  <div class="wrap">
    <button class="btn" id="prevBtn">Wstecz</button>
    <button class="btn primary" id="nextBtn">Dalej</button>
  </div>
</div>

<div class="menu" id="menu" role="dialog" aria-modal="true" aria-label="Przejdź do fazy">
  <div class="sheet">
    <h2>Przejdź do fazy</h2>
    <div id="jumpList"></div>
    <button class="btn reset" id="resetBtn">Wyczyść odhaczenia</button>
    <button class="btn reset" id="closeMenu">Zamknij</button>
  </div>
</div>

<script>
// Fazy: "days" mówi, w których wariantach dnia faza (lub krok) się pojawia.
const PHASES = [
  {id:"arrive", title:"Przyjście", hint:"Bezpieczeństwo i obchód", days:["delivery","regular"], items:[
    {id:"a1", lead:"Wyłączyć alarm i zapalić światła"},
    {id:"a2", lead:"Obchód sali, kuchni i zaplecza", sub:"czystość, usterki, nic podejrzanego"},
    {id:"a3", lead:"Sprawdzić grafik i obsadę zmiany"}
  ]},
  {id:"equip", title:"Urządzenia", hint:"Włączać stopniowo, po kolei", days:["regular","delivery"], items:[
    {id:"e1", lead:"Włączyć urządzenia grzewcze jedno po drugim", sub:"nie wszystkie naraz, żeby nie przeciążyć instalacji"},
    {id:"e2", lead:"Uruchomić frytownice i sprawdzić poziom oleju"},
    {id:"e3", lead:"Włączyć ekspres i urządzenia do napojów"},
    {id:"e4", lead:"Sprawdzić temperatury lodówek i zamrażarek", sub:"wpisać wyniki do rejestru"}
  ]},
  {id:"docs", title:"Dokumenty", hint:"Komputer i wydruki", days:["delivery","regular"], items:[
    {id:"d1", lead:"Wydrukować dokument dostawy", days:["delivery"]},
    {id:"d2", lead:"Przygotować plan pozycyjny zespołu"},
    {id:"d3", lead:"Sprawdzić listę strat z poprzedniego dnia"}
  ]},
  {id:"delivery", title:"Przyjęcie dostawy", hint:"Tylko w dni dostaw", days:["delivery"], items:[
    {id:"v1", lead:"Sprawdzić temperatury produktów chłodzonych i mrożonych"},
    {id:"v2", lead:"Porównać ilości z dokumentem dostawy", sub:"braki i uszkodzenia od razu zanotować"},
    {id:"v3", lead:"Rozłożyć towar zgodnie z FIFO"},
    {id:"v4", lead:"Zgłosić rozbieżności i podpisać dokument"}
  ]},
  {id:"cash", title:"Sejf i kasy", hint:"Gotówka na start dnia", days:["delivery","regular"], items:[
    {id:"c1", lead:"Przeliczyć sejf"},
    {id:"c2", lead:"Przygotować wkłady dla kasjerów"},
    {id:"c3", lead:"Przypisać kasetkę do kasjera"}
  ]},
  {id:"stations", title:"Stanowiska", hint:"Wszystko gotowe do pracy", days:["delivery","regular"], items:[
    {id:"s1", lead:"Uzupełnić stanowiska i opakowania"},
    {id:"s2", lead:"Sprawdzić daty ważności produktów"},
    {id:"s3", lead:"Sprawdzić kioski, kasy i tablety dostaw", sub:"czy menu, ceny i dostępność się zgadzają"}
  ]},
  {id:"huddle", title:"Odprawa", hint:"Krótko, przed otwarciem", days:["delivery","regular"], items:[
    {id:"h1", lead:"Omówić plan pozycyjny i przerwy"},
    {id:"h2", lead:"Podać cel na dzień"}
  ]},
  {id:"open", title:"Otwarcie", hint:"Drzwi otwarte", days:["delivery","regular"], timer:true, items:[
    {id:"o1", lead:"Otworzyć restaurację o czasie"},
    {id:"o2", lead:"Włączyć timer na mycie rąk – 60 min", sub:"gdy dzwoni: wszyscy myją ręce + obchód restauracji"}
  ]}
];
const ORDER = {
  delivery:["arrive","docs","delivery","equip","cash","stations","huddle","open"],
  regular:["arrive","equip","docs","cash","stations","huddle","open"]
};

const store = {
  get(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const todayDelivery = [1,3,5].includes(new Date().getDay());
let state = {
  day: store.get("oc_day", todayDelivery ? "delivery" : "regular"),
  view: store.get("oc_view", "focus"),
  checked: store.get("oc_checked", {}),
  pos: store.get("oc_pos", 0),
  open: {}
};
let timerEnd = null, timerTick = null;

function phasesForDay(){
  return ORDER[state.day].map(id => PHASES.find(p => p.id === id))
    .map(p => ({...p, items: p.items.filter(i => !i.days || i.days.includes(state.day))}));
}
function save(){
  store.set("oc_day",state.day);store.set("oc_view",state.view);
  store.set("oc_checked",state.checked);store.set("oc_pos",state.pos);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const list = phasesForDay();
  state.pos = Math.min(state.pos, list.length-1);
  document.body.dataset.view = state.view;
  document.querySelectorAll("[data-day]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.day===state.day));
  document.querySelectorAll(".seg [data-view]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===state.view));
  document.getElementById("autoNote").textContent =
    "Dziś " + (todayDelivery ? "jest dzień dostawy (pn, śr, pt)" : "nie ma dostawy") + ", wariant wybrany automatycznie.";

  let total=0, done=0;
  const html = list.map((p,idx)=>{
    const pd = p.items.filter(i=>state.checked[i.id]).length;
    total += p.items.length; done += pd;
    const complete = pd===p.items.length;
    const open = state.open[p.id] ?? !complete;
    const items = p.items.map(i=>`
      <li class="item"><label>
        <input type="checkbox" data-id="${i.id}" ${state.checked[i.id]?"checked":""}>
        <span><span class="lead">${esc(i.lead)}</span>${i.sub?`<span class="sub">${esc(i.sub)}</span>`:""}</span>
      </label></li>`).join("");
    const timer = p.timer ? `<div class="timer"><span>Timer mycia rąk</span><b id="timerTxt">60:00</b><button type="button" id="timerBtn">Start</button></div>` : "";
    return `<section class="phase ${complete?"complete":""} ${open?"open":""} ${idx===state.pos?"current":""}" data-phase="${p.id}">
      <button class="phase-head" type="button" data-toggle="${p.id}" aria-expanded="${open}">
        <span class="num">${complete?"✓":idx+1}</span>
        <span class="ptitle"><strong>${esc(p.title)}</strong><span>${esc(p.hint)} · ${pd}/${p.items.length}</span></span>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <ul class="items">${items}${timer}</ul>
    </section>`;
  }).join("");
  document.getElementById("phases").innerHTML = html;
  document.getElementById("count").innerHTML = `<b>${done}</b>/${total}`;
  const pct = total ? Math.round(done/total*100) : 0;
  const fill = document.getElementById("fill");
  fill.style.width = pct+"%"; fill.classList.toggle("full", pct===100);
  document.getElementById("track").setAttribute("aria-valuenow", pct);
  document.getElementById("doneMsg").style.display = (pct===100 && state.view==="list") ? "block" : "none";
  document.getElementById("prevBtn").disabled = state.pos===0;
  const last = state.pos===list.length-1;
  document.getElementById("nextBtn").textContent = last ? (pct===100?"Gotowe":"Ostatnia faza") : "Dalej";
  document.getElementById("nextBtn").disabled = last;
  document.getElementById("jumpList").innerHTML = list.map((p,idx)=>{
    const pd = p.items.filter(i=>state.checked[i.id]).length;
    return `<button class="jump" type="button" data-jump="${idx}"><span class="num">${pd===p.items.length?"✓":idx+1}</span>${esc(p.title)} <span style="margin-left:auto;color:var(--muted)">${pd}/${p.items.length}</span></button>`;
  }).join("");
  updateTimer();
  save();
}

function updateTimer(){
  const t = document.getElementById("timerTxt"), b = document.getElementById("timerBtn");
  if(!t) return;
  if(!timerEnd){t.textContent="60:00";b.textContent="Start";return}
  const left = Math.max(0, timerEnd - Date.now());
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  t.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  b.textContent = "Stop";
  if(left===0){
    t.textContent="Myjemy ręce!";
    timerEnd = Date.now() + 60*60000; // powtarza się co godzinę
    if(navigator.vibrate) navigator.vibrate([300,150,300]);
  }
}

document.addEventListener("change", e=>{
  if(e.target.matches("input[data-id]")){ state.checked[e.target.dataset.id] = e.target.checked; render(); }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.day){ state.day=t.dataset.day; state.pos=0; render(); }
  else if(t.dataset.view && t.closest(".seg")){ state.view=t.dataset.view; render(); }
  else if(t.dataset.toggle && state.view==="list"){ const id=t.dataset.toggle; const sec=t.closest(".phase"); state.open[id]=!sec.classList.contains("open"); render(); }
  else if(t.dataset.jump){ state.pos=+t.dataset.jump; state.view="focus"; closeMenu(); render(); window.scrollTo(0,0); }
  else if(t.id==="prevBtn"){ state.pos=Math.max(0,state.pos-1); render(); window.scrollTo(0,0); }
  else if(t.id==="nextBtn"){ state.pos++; render(); window.scrollTo(0,0); }
  else if(t.id==="menuBtn"){ document.getElementById("menu").classList.add("show"); }
  else if(t.id==="closeMenu"){ closeMenu(); }
  else if(t.id==="resetBtn"){ state.checked={}; state.pos=0; state.open={}; closeMenu(); render(); }
  else if(t.id==="timerBtn"){
    if(timerEnd){ timerEnd=null; clearInterval(timerTick); }
    else { timerEnd=Date.now()+60*60000; timerTick=setInterval(updateTimer,1000); }
    updateTimer();
  }
});
document.getElementById("menu").addEventListener("click", e=>{ if(e.target.id==="menu") closeMenu(); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeMenu(); });
function closeMenu(){ document.getElementById("menu").classList.remove("show"); }
render();
</script>
</body>
</html>
